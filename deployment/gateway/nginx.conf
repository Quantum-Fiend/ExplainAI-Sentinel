worker_processes 1;

events { worker_connections 1024; }

http {
    sendfile on;

    upstream runtime_service {
        server runtime:8000;
    }

    upstream ai_service {
        server ai-engine:8001;
    }

    upstream dashboard_service {
        server dashboard:80;
    }

    server {
        listen 80;

        location /api/v1/runtime/ {
            proxy_pass http://runtime_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/ai/ {
            proxy_pass http://ai_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://dashboard_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
