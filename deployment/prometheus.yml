global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'runtime'
    static_configs:
      - targets: ['runtime:8000']

  - job_name: 'ai-engine'
    static_configs:
      - targets: ['ai-engine:8001']

  - job_name: 'policy-engine'
    static_configs:
      - targets: ['policy-engine:8003']

  - job_name: 'knowledge-graph'
    static_configs:
      - targets: ['knowledge-graph:8002']
