version: '3.8'
services:
  runtime:
    build:
      context: ../runtime
      dockerfile: Dockerfile
    container_name: sentinel-runtime
    ports:
      - 8000:8000
    networks:
      - sentinel-network
    environment:
      SERVICE_NAME: runtime
      PORT: '8000'
      LOG_LEVEL: info
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 3
  ai-engine:
    build:
      context: ../ai-engine
      dockerfile: Dockerfile
    container_name: sentinel-ai-engine
    ports:
      - 8001:8001
    networks:
      - sentinel-network
    environment:
      SERVICE_NAME: ai-engine
      PORT: '8001'
      LOG_LEVEL: info
      PYTHONUNBUFFERED: '1'
      MODEL_PATH: /app/models
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8001/health
      interval: 30s
      timeout: 10s
      retries: 3
  knowledge-graph:
    build:
      context: ../knowledge-graph
      dockerfile: Dockerfile
    container_name: sentinel-knowledge-graph
    ports:
      - 8002:8002
    networks:
      - sentinel-network
    environment:
      SERVICE_NAME: knowledge-graph
      PORT: '8002'
      LOG_LEVEL: info
      SPARK_MASTER: local[*]
      NEO4J_URI: bolt://neo4j:7687
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8002/health
      interval: 30s
      timeout: 10s
      retries: 3
  policy-engine:
    build:
      context: ../policy-engine
      dockerfile: Dockerfile
    container_name: sentinel-policy-engine
    ports:
      - 8003:8003
    networks:
      - sentinel-network
    environment:
      SERVICE_NAME: policy-engine
      PORT: '8003'
      LOG_LEVEL: info
      RUST_LOG: info
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8003/health
      interval: 30s
      timeout: 10s
      retries: 3
  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: sentinel-dashboard
    ports:
      - 3000:80
    networks:
      - sentinel-network
    environment:
      SERVICE_NAME: dashboard
      PORT: '3000'
      LOG_LEVEL: info
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:80/
      interval: 30s
      timeout: 10s
      retries: 3
  networking:
    build:
      context: ../networking
      dockerfile: Dockerfile
    container_name: sentinel-networking
    ports:
      - 8080:8080
    networks:
      - sentinel-network
    environment:
      SERVICE_NAME: networking
      PORT: '8080'
      LOG_LEVEL: info
    restart: unless-stopped
  logging:
    build:
      context: ../logging
      dockerfile: Dockerfile
    container_name: sentinel-logging
    ports:
      - 8082:8082
    networks:
      - sentinel-network
    environment:
      SERVICE_NAME: logging
      PORT: '8082'
      LOG_LEVEL: info
    restart: unless-stopped
  data-pipeline:
    build:
      context: ../data-pipeline
      dockerfile: Dockerfile
    container_name: sentinel-data-pipeline
    ports:
      - 8083:8083
    networks:
      - sentinel-network
    environment:
      SERVICE_NAME: data-pipeline
      PORT: '8083'
      LOG_LEVEL: info
    restart: unless-stopped
  postgres:
    image: postgres:15-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sentinel-network
    ports:
      - 5432:5432
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    volumes:
      - redis-data:/data
    networks:
      - sentinel-network
    ports:
      - 6379:6379
  neo4j:
    image: neo4j:5-community
    container_name: sentinel-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j-data:/data
    networks:
      - sentinel-network
    ports:
      - 7474:7474
      - 7687:7687
  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - sentinel-network
    ports:
      - 9090:9090
  grafana:
    image: grafana/grafana:latest
    container_name: sentinel-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    networks:
      - sentinel-network
    ports:
      - 3001:3000
networks:
  sentinel-network:
    driver: bridge
volumes:
  postgres-data: {}
  redis-data: {}
  neo4j-data: {}
