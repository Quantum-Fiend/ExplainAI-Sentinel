apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-graph
  namespace: explainai-sentinel
  labels:
    app: knowledge-graph
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledge-graph
  template:
    metadata:
      labels:
        app: knowledge-graph
    spec:
      containers:
      - name: knowledge-graph
        image: explainai-sentinel/knowledge-graph:latest
        ports:
        - containerPort: 8002
        env:
        - name: SERVICE_NAME
          value: knowledge-graph
        - name: PORT
          value: "8002"
        - name: SPARK_MASTER
          value: "local[*]"
        - name: NEO4J_URI
          value: "bolt://neo4j:7687"
        resources:
          requests:
            memory: 1Gi
            cpu: 500m
          limits:
            memory: 2Gi
            cpu: 2000m
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 60
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-graph
  namespace: explainai-sentinel
  labels:
    app: knowledge-graph
spec:
  type: ClusterIP
  ports:
  - port: 8002
    targetPort: 8002
  selector:
    app: knowledge-graph
