apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime
  namespace: explainai-sentinel
  labels:
    app: runtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app: runtime
  template:
    metadata:
      labels:
        app: runtime
    spec:
      containers:
      - name: runtime
        image: explainai-sentinel/runtime:latest
        ports:
        - containerPort: 8000
        env:
        - name: SERVICE_NAME
          value: runtime
        - name: PORT
          value: "8000"
        - name: LOG_LEVEL
          value: info
        resources:
          requests:
            memory: 256Mi
            cpu: 250m
          limits:
            memory: 1Gi
            cpu: 1000m
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: runtime
  namespace: explainai-sentinel
  labels:
    app: runtime
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
  selector:
    app: runtime
