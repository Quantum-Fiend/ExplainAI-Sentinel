apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-engine
  namespace: explainai-sentinel
  labels:
    app: ai-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-engine
  template:
    metadata:
      labels:
        app: ai-engine
    spec:
      containers:
      - name: ai-engine
        image: explainai-sentinel/ai-engine:latest
        ports:
        - containerPort: 8001
        env:
        - name: SERVICE_NAME
          value: ai-engine
        - name: PORT
          value: "8001"
        - name: LOG_LEVEL
          value: info
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: MODEL_PATH
          value: /app/models
        resources:
          requests:
            memory: 256Mi
            cpu: 250m
          limits:
            memory: 1Gi
            cpu: 1000m
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-engine
  namespace: explainai-sentinel
  labels:
    app: ai-engine
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
  selector:
    app: ai-engine
