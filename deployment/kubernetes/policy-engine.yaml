apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-engine
  namespace: explainai-sentinel
  labels:
    app: policy-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: policy-engine
  template:
    metadata:
      labels:
        app: policy-engine
    spec:
      containers:
      - name: policy-engine
        image: explainai-sentinel/policy-engine:latest
        ports:
        - containerPort: 8003
        env:
        - name: SERVICE_NAME
          value: policy-engine
        - name: PORT
          value: "8003"
        - name: RUST_LOG
          value: info
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 500m
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: policy-engine
  namespace: explainai-sentinel
  labels:
    app: policy-engine
spec:
  type: ClusterIP
  ports:
  - port: 8003
    targetPort: 8003
  selector:
    app: policy-engine
