apiVersion: apps/v1
kind: Deployment
metadata:
  name: networking
  namespace: explainai-sentinel
  labels:
    app: networking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: networking
  template:
    metadata:
      labels:
        app: networking
    spec:
      containers:
      - name: networking
        image: explainai-sentinel/networking:latest
        ports:
        - containerPort: 8080
        env:
        - name: SERVICE_NAME
          value: networking
        - name: PORT
          value: "8080"
        resources:
          requests:
            memory: 512Mi
            cpu: 500m
          limits:
            memory: 1Gi
            cpu: 1000m
---
apiVersion: v1
kind: Service
metadata:
  name: networking
  namespace: explainai-sentinel
  labels:
    app: networking
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: networking
