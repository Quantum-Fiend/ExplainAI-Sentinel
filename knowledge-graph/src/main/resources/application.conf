# Knowledge Graph Engine Configuration
sentinel.kg {
  api {
    host = "0.0.0.0"
    port = 8002
  }
  neo4j {
    uri = "bolt://neo4j:7687"
    user = "neo4j"
    password = "password"
  }
  spark {
    app_name = "Sentinel-KG-Engine"
    master = "local[*]"
    checkpoint_dir = "/tmp/spark-checkpoint"
  }
  analytics {
    pagerank_tol = 0.01
    pagerank_reset_prob = 0.15
  }
}
